name: HiFi images

# Builds the HiFi SSH broker and backend images that the generated compose file
# references (ghcr.io/yurillab/qpot-ssh-{proxy,backend}). Nothing else published
# them, so HiFi mode could not be deployed. Every PR/push builds and smoke-tests
# both architectures; pushes to main publish those tested images to GHCR. The
# ssh-proxy image also carries qpot-netguard, the egress guard every instance
# runs; its smoke test checks the guard against real docker networking.
#
# Note: GHCR creates a new package as private. After the first publish, set
# both packages to public once (package settings) so users can pull them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "docker/ssh-proxy/**"
      - "docker/ssh-backend/**"
      - "cmd/qpot-sshproxy/**"
      - "cmd/qpot-sshbackend/**"
      - "cmd/qpot-netguard/**"
      - "internal/proxy/**"
      - "internal/sshbackend/**"
      - "internal/netguard/**"
      - "internal/instance/**"
      - "internal/config/**"
      - "internal/cleanup/**"
      - "scripts/test-hifi.sh"
      - ".github/workflows/ci.yml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Complete source and platform validation
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write

  semantic-validation:
    name: Complete semantic security analysis
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  build:
    name: Build and smoke-test ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ssh-proxy, arch: amd64, runner: ubuntu-latest }
          - { image: ssh-backend, arch: amd64, runner: ubuntu-latest }
          - { image: ssh-proxy, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: ssh-backend, arch: arm64, runner: ubuntu-24.04-arm }
    env:
      IMAGE: ghcr.io/yurillab/qpot-${{ matrix.image }}
      TEST_IMAGE: ghcr.io/yurillab/qpot-${{ matrix.image }}:ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the native image for acceptance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Set up Go for backend acceptance
        if: matrix.image == 'ssh-backend'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Exercise real SSH state, recording and file transfer
        if: matrix.image == 'ssh-backend'
        env:
          QPOT_TEST_SSH_BACKEND: "1"
          QPOT_SSH_BACKEND_IMAGE: ${{ env.TEST_IMAGE }}
        # Network-none: Docker exec carries the SSH bytes; no real targets.
        run: go test -race -count=1 -timeout 4m ./internal/sshbackend -run '^TestSSHBackendLive$'

      - name: Smoke-test the backend (real sshd answers)
        if: matrix.image == 'ssh-backend'
        run: |
          set -euo pipefail
          docker run -d --name be -p 127.0.0.1:2222:22 "${TEST_IMAGE}"
          for _ in $(seq 1 30); do
            if banner=$(timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -n 1 <&3' 2>/dev/null) \
               && [[ "$banner" == SSH-2.0-OpenSSH* ]]; then
              echo "backend banner: ${banner}"
              docker rm -f be >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs be
          echo "::error::ssh-backend did not serve an OpenSSH banner"
          exit 1

      - name: Smoke-test the backend with host keys shared from Windows
        if: matrix.image == 'ssh-backend'
        # Docker Desktop shows every file shared from Windows as 0777, root's.
        # sshd refuses a host key others may read; the backend must still
        # serve the mounted pool key, from a private copy.
        run: |
          set -euo pipefail
          keys=$(mktemp -d)
          docker run --rm --network none --entrypoint sh -v "$keys:/k" "${TEST_IMAGE}" -c \
            'for t in rsa ecdsa ed25519; do ssh-keygen -q -t $t -f /k/ssh_host_${t}_key -N "" </dev/null; done; chmod 0777 /k /k/*'
          want=$(docker run --rm --network none --entrypoint ssh-keygen -v "$keys:/k:ro" "${TEST_IMAGE}" \
            -lf /k/ssh_host_ed25519_key.pub | awk '{print $2}')
          docker run -d --name be2 --network none -v "$keys:/run/sshd/bootstrap/keys:ro" "${TEST_IMAGE}"
          got=""
          for _ in $(seq 1 30); do
            got=$(docker exec be2 sh -c 'ssh-keyscan -t ed25519 127.0.0.1 2>/dev/null | ssh-keygen -lf -' 2>/dev/null | awk '{print $2}' || true)
            if [ -n "$got" ]; then break; fi
            sleep 1
          done
          if [ "$got" != "$want" ]; then
            docker logs be2 || true
            echo "::error::backend served '${got}', want the mounted key ${want}"
            exit 1
          fi
          echo "backend serves the mounted key: ${got}"
          docker exec --user 65534:65534 be2 sh -c 'test ! -r /run/sshd/bootstrap/keys/ssh_host_ed25519_key'
          docker rm -f be2 >/dev/null

      - name: Smoke-test the broker (starts, refuses bad config)
        if: matrix.image == 'ssh-proxy'
        run: |
          set -euo pipefail
          # Without backends it must refuse to start (fail loudly, not silently).
          if docker run --rm "${TEST_IMAGE}" 2>/dev/null; then
            echo "::error::broker started without QPOT_SSHPROXY_BACKENDS"; exit 1
          fi
          docker run -d --name bk -e QPOT_SSHPROXY_BACKENDS="be1=127.0.0.1:22" \
            -e QPOT_SSHPROXY_LOG=/tmp/sessions.json "${TEST_IMAGE}"
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' bk)" = "true" || { docker logs bk; exit 1; }
          docker logs bk
          docker rm -f bk >/dev/null

      - name: Smoke-test the egress guard (real docker networking)
        if: matrix.image == 'ssh-proxy'
        run: |
          set -euo pipefail
          CURL=curlimages/curl:8.11.1
          docker pull -q "$CURL" >/dev/null
          docker pull -q python:3.13-alpine >/dev/null
          # A honeypot-like network with a fixed bridge name, as QPot creates.
          docker network create -o com.docker.network.bridge.name=br-qpotci0001 \
            --subnet 172.31.250.0/24 --gateway 172.31.250.1 ngtest >/dev/null
          # Things the guard must protect: a service on the docker host, reached
          # through the bridge gateway and through the host's own address.
          python3 -m http.server 18080 --bind 0.0.0.0 >/dev/null 2>&1 &
          HOSTIP=$(hostname -I | awk '{print $1}')
          # A honeypot answering on a published port.
          docker run -d --name hp --network ngtest -p 18081:8080 python:3.13-alpine \
            python -m http.server 8080 >/dev/null
          sleep 3
          probe() { docker run --rm --network ngtest "$CURL" -s -m 5 -o /dev/null -w '%{http_code}' "$1" || true; }
          expect() { # expect <label> <url> open|blocked
            code=$(probe "$2")
            if [ "$3" = open ] && [ "$code" != 200 ]; then echo "::error::$1: want open, got '$code'"; return 1; fi
            if [ "$3" = blocked ] && [ -n "$code" ] && [ "$code" != 000 ]; then echo "::error::$1: want blocked, got '$code'"; return 1; fi
            echo "$1: $3 ($code)"
          }
          inbound() { curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/ | grep -qx 200 && echo "inbound published port: open"; }
          echo "--- without the guard"
          expect "docker host via gateway" http://172.31.250.1:18080/ open
          expect "docker host via its address" "http://${HOSTIP}:18080/" open
          inbound
          guard() { # guard <mode>
            docker rm -f ng >/dev/null 2>&1 || true
            docker run -d --name ng --network host --user 0:0 --read-only \
              --cap-drop ALL --cap-add NET_ADMIN --security-opt no-new-privileges \
              --entrypoint /qpot-netguard -e QPOT_NETGUARD_TABLE=qpot_egress_ci \
              -e QPOT_NETGUARD_IFACES=br-qpotci0001 -e QPOT_NETGUARD_MODE="$1" "${TEST_IMAGE}" run >/dev/null
            for _ in $(seq 1 15); do
              if docker exec ng /qpot-netguard check >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            docker logs ng; echo "::error::netguard check never passed"; return 1
          }
          echo "--- guard, private mode"
          guard private
          expect "docker host via gateway" http://172.31.250.1:18080/ blocked
          expect "docker host via its address" "http://${HOSTIP}:18080/" blocked
          expect "cloud metadata" http://169.254.169.254/ blocked
          expect "public internet (DNS + HTTPS)" https://example.com/ open
          inbound || { echo "::error::published port broken by the guard"; exit 1; }
          echo "--- guard, all mode (block_outbound)"
          guard all
          expect "public internet" https://example.com/ blocked
          inbound || { echo "::error::published port broken by the guard"; exit 1; }
          # It refuses a bad spec instead of applying something else.
          if docker run --rm --network host --user 0:0 --cap-drop ALL --cap-add NET_ADMIN \
               --entrypoint /qpot-netguard -e QPOT_NETGUARD_TABLE='x;y' \
               -e QPOT_NETGUARD_IFACES=br-qpotci0001 "${TEST_IMAGE}" apply 2>/dev/null; then
            echo "::error::netguard applied a bad table name"; exit 1
          fi
          docker logs ng
          docker rm -f ng hp >/dev/null
          docker network rm ngtest >/dev/null

      - name: Save the tested image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hifi-image"
          docker save "${TEST_IMAGE}" | gzip -1 > "$RUNNER_TEMP/hifi-image/${{ matrix.image }}-${{ matrix.arch }}.tar.gz"
      - name: Retain the tested image for the integration gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hifi-${{ matrix.image }}-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hifi-image/${{ matrix.image }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  hifi-validation:
    name: Validate the tested images (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download only this workflow's tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hifi-*-${{ matrix.arch }}-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/hifi-images
      - name: Load the tested images
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for image in ssh-proxy ssh-backend; do
            gzip -dc "$RUNNER_TEMP/hifi-images/${image}-${ARCH}.tar.gz" | docker load
            docker tag "ghcr.io/yurillab/qpot-${image}:ci-${ARCH}" "ghcr.io/yurillab/qpot-${image}:ci"
          done
      - name: Require the same live gate used by CI
        run: bash scripts/test-hifi.sh --use-built-images

  publish:
    name: Publish validated ${{ matrix.image }}
    needs: [build, hifi-validation, source-validation, semantic-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ssh-proxy, ssh-backend]
    env:
      IMAGE: ghcr.io/yurillab/qpot-${{ matrix.image }}
      IMAGE_NAME: ${{ matrix.image }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Download only this workflow's tested architecture archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hifi-${{ matrix.image }}-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/hifi-images

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No source checkout or rebuild occurs with registry write permission.
      # Each pushed image is the same saved image that passed native acceptance
      # and the full same-architecture HiFi integration matrix in this run.
      # Preserve :latest for older released CLIs whose image compatibility has
      # not been established. New release binaries use their full commit ref.
      - name: Publish the tested images and their immutable manifest
        run: |
          set -euo pipefail
          digests=()
          for arch in amd64 arm64; do
            gzip -dc "$RUNNER_TEMP/hifi-images/${IMAGE_NAME}-${arch}.tar.gz" | docker load
            tested="${IMAGE}:ci-${arch}"
            actual_platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$tested")
            test "$actual_platform" = "linux/$arch"
            ref="${IMAGE}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
            docker tag "$tested" "$ref"
            docker push "$ref"
            digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")
            digest=${digest_ref#"${IMAGE}@sha256:"}
            if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::pushed image has no matching immutable repository digest' >&2
              exit 1
            fi
            digests+=("$digest_ref")
          done
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_SHA}" "${digests[@]}"
