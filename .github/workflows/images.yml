name: HiFi images

# Builds the HiFi SSH broker and backend images that the generated compose file
# references (ghcr.io/yurillab/qpot-ssh-{proxy,backend}). Nothing else published
# them, so HiFi mode could not be deployed. Every PR/push builds and smoke-tests
# both images; pushes to main also publish multi-arch images to GHCR.
#
# Note: GHCR creates a new package as private. After the first publish, set
# both packages to public once (package settings) so users can pull them.

on:
  push:
    branches: [main]
    paths:
      - "docker/ssh-proxy/**"
      - "docker/ssh-backend/**"
      - "cmd/qpot-sshproxy/**"
      - "internal/proxy/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/ssh-proxy/**"
      - "docker/ssh-backend/**"
      - "cmd/qpot-sshproxy/**"
      - "internal/proxy/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, smoke-test & publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # only used by the publish step on main
    strategy:
      fail-fast: false
      matrix:
        image: [ssh-proxy, ssh-backend]
    env:
      IMAGE: ghcr.io/yurillab/qpot-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (amd64, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke-test the backend (real sshd answers)
        if: matrix.image == 'ssh-backend'
        run: |
          set -euo pipefail
          docker run -d --name be -p 127.0.0.1:2222:22 "${IMAGE}:ci"
          for _ in $(seq 1 30); do
            if banner=$(timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -n 1 <&3' 2>/dev/null) \
               && [[ "$banner" == SSH-2.0-OpenSSH* ]]; then
              echo "backend banner: ${banner}"
              docker rm -f be >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs be
          echo "::error::ssh-backend did not serve an OpenSSH banner"
          exit 1

      - name: Smoke-test the broker (starts, refuses bad config)
        if: matrix.image == 'ssh-proxy'
        run: |
          set -euo pipefail
          # Without backends it must refuse to start (fail loudly, not silently).
          if docker run --rm "${IMAGE}:ci" 2>/dev/null; then
            echo "::error::broker started without QPOT_SSHPROXY_BACKENDS"; exit 1
          fi
          docker run -d --name bk -e QPOT_SSHPROXY_BACKENDS="be1=127.0.0.1:22" \
            -e QPOT_SSHPROXY_LOG=/tmp/sessions.json "${IMAGE}:ci"
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' bk)" = "true" || { docker logs bk; exit 1; }
          docker logs bk
          docker rm -f bk >/dev/null

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (amd64 + arm64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/YurilLAB/QPot
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
