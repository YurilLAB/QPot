name: CodeQL

# GitHub's semantic security analysis for Go. Complements gosec (pattern-based)
# with dataflow/taint analysis - it traces attacker-controlled input to
# dangerous sinks (injection, path traversal, SSRF, etc.) across function
# boundaries. Findings land in the repo's Security > Code scanning tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-scan weekly with the reviewed, reproducible analysis tool and queries.
    - cron: "27 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # required to upload CodeQL results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Load the pinned analysis versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci-tools.env >> "$GITHUB_ENV"

      - name: Download the verified CodeQL Go bundle
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 300 \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_VERSION}/codeql-bundle-go-linux64.tar.zst" \
            -o "$RUNNER_TEMP/qpot-codeql-go.tar.zst"
          printf '%s  %s\n' "$CODEQL_GO_BUNDLE_SHA256" "$RUNNER_TEMP/qpot-codeql-go.tar.zst" | sha256sum -c -

      - name: Initialize CodeQL
        id: codeql
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: manual
          tools: ${{ runner.temp }}/qpot-codeql-go.tar.zst
          packs: codeql/go-queries@${{ env.CODEQL_GO_QUERIES_VERSION }}
          # security-extended adds the higher-signal security queries on top of
          # the default suite.
          queries: security-extended

      - name: Verify the initialized analysis version
        env:
          ACTUAL_CODEQL_VERSION: ${{ steps.codeql.outputs.codeql-version }}
        run: test "$ACTUAL_CODEQL_VERSION" = "$CODEQL_VERSION"

      - name: Build the application for analysis
        # The automatic builder tidies nested metadata-only modules. Trace the
        # real production build without changing review-bound module files.
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:go"
          output: ${{ runner.temp }}/qpot-codeql

      - name: Require completed analysis without blocking security findings
        # CodeQL upload success alone does not mean no findings were reported.
        # Missing reports, failed analysis and findings must stop publication.
        run: go run ./internal/cicheck/cirun check-codeql "$RUNNER_TEMP/qpot-codeql" .github/codeql-reviews.json

      - name: Keep the analysed SARIF for review renewal
        # Review fingerprints hash the runner's own report; GitHub rewrites
        # the uploaded copy, so renewal needs these exact bytes.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif-${{ github.sha }}
          path: ${{ runner.temp }}/qpot-codeql
          if-no-files-found: ignore
          retention-days: 30
