name: CI

# Build, lint, static-analysis, security-scan, race-test and a short fuzz smoke
# run on every push/PR. This is the gate that would have caught the broken build
# that previously reached main (server.go referencing a method the worker
# lacked), plus the security and quality scanners added since.
#
# What we look for:
#   build-test   - it compiles, is gofmt-clean, passes go vet + staticcheck, and
#                  the full race-enabled test suite is green.
#   conpot-integration - real PLC/RTU protocols and persistent identities in isolated containers.
#   refrigeration-integration - built native supervisor, XML controls, exports and persistent state.
#   netguard-integration - actual IPv4/IPv6 packet containment in owned namespaces.
#   build-run    - the binary actually runs (CLI smoke) and renders a valid,
#                  non-self-identifying docker-compose.
#   govulncheck  - known CVEs reachable from our code (stdlib + deps), incl. a
#                  scan of the built binary.
#   gosec        - source-level security anti-patterns (SQL injection, weak
#                  crypto, TLS misconfig, command/path injection, bad perms);
#                  results uploaded to the GitHub Security tab as SARIF.
#   gitleaks     - secrets accidentally committed to the tree/history.
#   fuzz-smoke   - every Fuzz* target gets a short run so seed corpora + light
#                  mutation are exercised on every push.
#   connector-test - the ClickHouse-Kibana connector's ES->SQL translation is
#                  injection-safe (stdlib unittest + a 20k-iteration fuzz loop).
#   shellcheck   - the installer + ops shell scripts lint clean at error level.
#   actionlint   - the workflows themselves (and their embedded run: scripts)
#                  are valid and shellcheck-clean - CI scripts are code too.
#   mod-hygiene  - go.mod/go.sum verify against their hashes and are tidy.
#   cross-build  - all three binaries compile for every shipped OS/arch.
#   distro-runtime - the static binary actually launches and runs (CLI smoke)
#                  inside a matrix of real distro containers (Debian, Ubuntu,
#                  Fedora, Rocky, openSUSE, and musl-based Alpine) - catches
#                  runtime-portability breaks a cross-compile cannot.
#   coverage     - reports total/per-package coverage and guards a low floor.
#   install-windows - scripts/install.ps1 against a local fake release, on
#                  PowerShell 7 and Windows PowerShell 5.1, and the setup
#                  tests that build only on Windows.
#
# The tool versions and gosec's exclude list live in .github/ci-tools.env,
# which every job that needs them loads first; scripts/ci-local.sh runs these
# same jobs locally with the same file, so a local pass means a CI pass.
# (CodeQL semantic analysis runs from its own workflow, codeql.yml; deeper
#  scheduled fuzzing runs from fuzz.yml.)

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Least privilege by default; jobs opt into more only where needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet, fmt, staticcheck & race tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Load the pinned tool versions
        # Pinned so a tool-side change cannot silently alter results;
        # scripts/ci-local.sh reads the same file.
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci-tools.env >> "$GITHUB_ENV"

      - name: go build
        run: go build ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      # The patch layers are Python mounted into the images; a syntax
      # error there would only show as a honeypot that does not start.
      # Conpot uses Python 3.14 syntax; its patch is imported by the actual
      # image in conpot-integration instead of this runner's Python 3.11.
      - name: Compile the embedded honeypot patch files
        run: |
          set -euo pipefail
          for f in internal/instance/honeypotfiles/cowrie/*.py internal/instance/honeypotfiles/dionaea/*.py; do
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1], encoding="utf-8").read(), sys.argv[1])' "$f"
            echo "ok $f"
          done

      - name: staticcheck
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: go test -race
        run: go test -race -timeout 10m ./...

      - name: Makefile failure-path regressions
        run: bash scripts/test-makefile.sh

      - name: Install script failure-path regressions
        # Every installer failure prints its QP- code and exits with the
        # code's category status; a good install hands over to qpot setup.
        run: bash scripts/test-install.sh

  clickhouse-integration:
    name: ClickHouse database, worker & API integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.10.3.7@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
        env:
          CLICKHOUSE_DB: qpot_test
          CLICKHOUSE_USER: qpot
          CLICKHOUSE_PASSWORD: qpotpass
        ports:
          - 127.0.0.1:19000:9000
        options: >-
          --health-cmd "clickhouse-client --user qpot --password qpotpass --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QPOT_TEST_CLICKHOUSE: "1"
      QPOT_TEST_CH_HOST: 127.0.0.1
      QPOT_TEST_CH_PORT: "19000"
      QPOT_TEST_CH_USER: qpot
      QPOT_TEST_CH_PASS: qpotpass
      QPOT_TEST_CH_DB: qpot_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require fail-closed behavior without Keeper
        env:
          QPOT_TEST_CH_EXPECT_NO_KEEPER: "1"
        run: |
          set -euo pipefail
          required=TestCHIntelligenceLeaseMissingKeeperFailsClosed
          listed=$(go test ./internal/database -list "^${required}$")
          grep -Fxq "$required" <<<"$listed"
          go test -race -count=1 -timeout 2m -json ./internal/database -run "^${required}$" | tee "$RUNNER_TEMP/clickhouse-no-keeper-tests.jsonl"
          if grep -Fq '"Action":"skip"' "$RUNNER_TEMP/clickhouse-no-keeper-tests.jsonl"; then
            echo "required no-Keeper integration test skipped" >&2
            exit 1
          fi
      - name: Enable the production managed ClickHouse Keeper configuration
        env:
          CLICKHOUSE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          set -euo pipefail
          test -n "$CLICKHOUSE_CONTAINER"
          docker cp internal/instance/clickhouse_keeper.xml "$CLICKHOUSE_CONTAINER:/etc/clickhouse-server/config.d/qpot-keeper.xml"
          docker exec --user 0 "$CLICKHOUSE_CONTAINER" chmod 0644 /etc/clickhouse-server/config.d/qpot-keeper.xml
          docker restart "$CLICKHOUSE_CONTAINER"
          ready=0
          for _ in $(seq 1 30); do
            if timeout 8 docker exec "$CLICKHOUSE_CONTAINER" clickhouse-client --user qpot --password qpotpass --query "SELECT count() FROM system.zookeeper WHERE path = '/'"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker logs --tail 80 "$CLICKHOUSE_CONTAINER"
            echo "production managed Keeper did not become ready" >&2
            exit 1
          fi
      - name: Exercise the real storage pipeline and Keeper fencing
        # The negative gate ran before Keeper was installed. The positive
        # inventory excludes that case and rejects every skipped test.
        run: |
          set -euo pipefail
          test_packages=(./internal/database ./internal/intelligence ./internal/server)
          listed=$(go test "${test_packages[@]}" -list 'Test(CH|ClickHouse|WorkerClassifiesAgainstClickHouse|ServerServesDataFromClickHouse|IntelligenceClickHouse)')
          for required in TestCHIntelligenceLeaseNativeContentionAndFencing TestCHIntelligenceLeaseNativeExpiryAndLargeCheckpoint TestCHIntelligenceLeaseRejectsNonAtomicControlCatalog TestWorkerClassifiesAgainstClickHouse TestServerServesDataFromClickHouse; do
            if ! grep -Fxq "$required" <<<"$listed"; then
              echo "required ClickHouse integration test is missing: $required" >&2
              exit 1
            fi
          done
          names=$(printf '%s\n' "$listed" | grep '^Test' | grep -Fv TestCHIntelligenceLeaseMissingKeeperFailsClosed | paste -sd '|')
          test -n "$names"
          go test -race -p 1 -count=1 -timeout 5m -json "${test_packages[@]}" -run "^($names)$" | tee "$RUNNER_TEMP/clickhouse-tests.jsonl"
          if grep -Fq '"Action":"skip"' "$RUNNER_TEMP/clickhouse-tests.jsonl"; then
            echo "required ClickHouse integration test skipped" >&2
            exit 1
          fi

  postgres-lease-integration:
    name: Native PostgreSQL ownership and fencing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: docker.io/library/postgres:15-bookworm@sha256:19b8449e2187e8a174b40c8832a7ed9da45813b74c2779b1c614e7e7d0ee47f0
        env:
          POSTGRES_DB: qpot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:15432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname qpot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QPOT_TEST_POSTGRES: "1"
      QPOT_TEST_PG_HOST: 127.0.0.1
      QPOT_TEST_PG_PORT: "15432"
      QPOT_TEST_PG_USER: postgres
      QPOT_TEST_PG_PASS: postgres
      QPOT_TEST_PG_DB: qpot_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise real transactional lease ownership and recovery
        run: |
          set -euo pipefail
          pattern='^TestPGIntelligenceLease'
          listed=$(go test ./internal/database -list "$pattern")
          for required in TestPGIntelligenceLeaseIndependentOwnersAndAliases TestPGIntelligenceLeaseShadowCheckpointCannotSplitOwner TestPGIntelligenceLeaseRejectsDifferentProjectionScope TestPGIntelligenceLeaseCoordinatesDifferentDatabaseRoles TestPGIntelligenceLeaseExpiryRecoveryAndLargeCheckpoint TestPGIntelligenceLeaseClockCheckedAfterRowLock TestPGIntelligenceLeasePublicCheckpointProjectionAndTags; do
            if ! grep -Fxq "$required" <<<"$listed"; then
              echo "required PostgreSQL lease test is missing: $required" >&2
              exit 1
            fi
          done
          go test -race -count=1 -timeout 5m -json ./internal/database -run "$pattern" | tee "$RUNNER_TEMP/postgres-lease-tests.jsonl"
          if grep -Fq '"Action":"skip"' "$RUNNER_TEMP/postgres-lease-tests.jsonl"; then
            echo "required PostgreSQL lease test skipped" >&2
            exit 1
          fi

  elasticsearch-lease-integration:
    name: Native Elasticsearch ownership and fencing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      elasticsearch:
        # Match the native lease fixture's version; pin the official image.
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0@sha256:2f602552550869fb29b6fd5848c5118d3ef3a2e1d5d45802e3ab9088cb2de8e2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          node.store.allow_mmap: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 127.0.0.1:19200:9200
        options: >-
          --health-cmd "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"
          --health-interval 5s
          --health-timeout 8s
          --health-retries 24
    env:
      QPOT_TEST_ELASTICSEARCH_LEASE: "1"
      QPOT_TEST_ELASTICSEARCH_LEASE_URL: http://127.0.0.1:19200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise real optimistic lease ownership and recovery
        # This test requires an unused checkpoint index and owns its cleanup.
        # Other Elasticsearch fixtures must not share this service.
        run: |
          set -euo pipefail
          required=TestElasticsearchIntelligenceLeaseLive
          listed=$(go test ./internal/database -list "^${required}$")
          grep -Fxq "$required" <<<"$listed"
          go test -race -count=1 -timeout 3m -json ./internal/database -run "^${required}$" | tee "$RUNNER_TEMP/elasticsearch-lease-tests.jsonl"
          if grep -Fq '"Action":"skip"' "$RUNNER_TEMP/elasticsearch-lease-tests.jsonl"; then
            echo "required Elasticsearch lease test skipped" >&2
            exit 1
          fi

  conpot-integration:
    name: Live industrial PLC and RTU protocols
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QPOT_TEST_CONPOT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Pull the versioned Conpot image
        run: docker pull ghcr.io/telekom-security/conpot:24.04.2@sha256:be17a238709c78909c7d2e0da55bc3ea66dc3aa46618f0d89b7080f3e7dda3e8
      - name: Exercise industrial device protocols and persistent identity
        # No host ports or external container connectivity; clients execute
        # inside isolated namespaces. Requested tests fail if the image is absent.
        run: go test -race -count=1 -timeout 8m ./internal/instance -run '^TestConpotLiveProfiles$'

  refrigeration-integration:
    name: Live refrigeration supervisor and packaged image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QPOT_TEST_REFRIGERATION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise bundled-source image, XML controls and persistent state
        # Builds the image emitted by the installed CLI. Tests probe it inside
        # its isolated network namespace; no production guard is bypassed.
        run: go test -race -count=1 -timeout 12m ./internal/instance -run '^TestRefrigerationLive'

  netguard-integration:
    name: Isolated kernel IPv4 and IPv6 cell containment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QPOT_TEST_NETGUARD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Ensure namespace networking tools
        run: |
          if ! command -v ip >/dev/null || ! command -v unshare >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y iproute2 util-linux
          fi
      - name: Exercise real kernel cell rules
        # All bridges, endpoints, forwarding settings and nftables live in a
        # fresh network namespace. Runner policy is never disabled. If Ubuntu
        # restricts unprivileged user namespaces, sudo starts only the same
        # prebuilt test in an owned network namespace; a denial still fails.
        run: |
          set -euo pipefail
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          go test -race -c -o "$test_dir/netguard.test" ./internal/netguard
          if unshare --user --map-root-user --net true; then
            "$test_dir/netguard.test" -test.run '^TestNetguardKernelIsolation$' -test.v -test.timeout 90s
          else
            sudo env QPOT_TEST_NETGUARD=1 QPOT_NETGUARD_ROOT_NAMESPACE=1 \
              "$test_dir/netguard.test" -test.run '^TestNetguardKernelIsolation$' -test.v -test.timeout 90s
          fi

  cowrie-stateful-integration:
    name: Real Cowrie SSH and SFTP state consequences
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QPOT_TEST_COWRIE_STATEFUL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Pull the reviewed multi-architecture Cowrie image
        run: docker pull ghcr.io/telekom-security/cowrie:24.04.2@sha256:65ef2aa192779c96f69d504aa1ece20d5150fab2dddfc8cf47e2efefb4e2574a
      - name: Exercise four profiles and real SSH and SFTP channels
        run: go test -race -count=1 -timeout 5m ./internal/instance -run '^TestCowrieStateful(Image|SSH)$'

  vector-integration:
    name: Real Vector normalization and delayed HiFi evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Pull the production collector
        run: docker pull timberio/vector:0.61.0-alpine@sha256:3bb7ed5152910ed51729e256937b1d8a4bf67ff624e9d565e8e5877bffd015c7
      - name: Exercise generated configuration and native evidence
        run: go test -race -count=1 -timeout 3m ./internal/instance -run 'TestHiFiVectorEvidenceLive|TestVector.*Live'

  hifi-organization-integration:
    name: Real private organization cells and whole-cell reset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QPOT_TEST_HIFI_LIVE: "1"
      QPOT_TEST_SSH_COLLECTOR: "1"
      QPOT_TEST_HIFI_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and exercise source images, containment, recording and reset
        # The production mandatory guard must become healthy. This test fails
        # on a host without the required kernel capability; it never bypasses it.
        run: bash scripts/test-hifi.sh


  docker-integration:
    name: Collector delivery and disk cleanup in real containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QPOT_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Pull the pinned collector image
        run: |
          set -euo pipefail
          image=$(grep -oE 'CollectorImage += "[^"]+"' internal/instance/compose.go | cut -d'"' -f2)
          test -n "$image"
          docker pull -q "$image"
      - name: Deliver, restart and clean up with the real collector and helper
        # Also the collector's live config and transform tests, which skip
        # wherever its image is missing.
        # The runner's ordinary user is in the docker group, as QPot runs:
        # logs other users own go through the helper container. The tests
        # stop and recreate their own containers only.
        run: |
          set -euo pipefail
          test_pattern='^(TestCollectorAndCleanupWithRealDocker|TestDockerHelperForReal|TestDockerSSHInventoryPrivateEvidenceAndUnsupportedObjects|TestVector[A-Za-z]*Live)$'
          test_packages=(./internal/server ./internal/cleanup ./internal/instance)
          listed=$(go test "${test_packages[@]}" -list "$test_pattern")
          for required in TestCollectorAndCleanupWithRealDocker TestDockerHelperForReal TestDockerSSHInventoryPrivateEvidenceAndUnsupportedObjects TestVectorRemapLive TestVectorConfigValidatesLive TestVectorEdgeConfigsValidateLive; do
            if ! grep -Fxq "$required" <<<"$listed"; then
              echo "required Docker integration test is missing: $required" >&2
              exit 1
            fi
          done
          go test -race -count=1 -timeout 15m "${test_packages[@]}" -run "$test_pattern"


  build-run:
    name: Build binary & CLI smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build qpot binary
        run: go build -o qpot ./cmd/qpot
      - name: Smoke-run the CLI
        run: |
          set -euo pipefail
          HOME="$(mktemp -d)"; export HOME
          ./qpot --version
          ./qpot --help >/dev/null
          ./qpot honeypot list
          ./qpot instance create ci-smoke
          instances=$(./qpot instance list)
          grep -q ci-smoke <<<"$instances"
          # The generated docker-compose.yml must render and be valid YAML, and
          # must not leak self-identifying env vars into honeypot containers.
          ./qpot honeypot enable cowrie -i ci-smoke
          ./qpot honeypot enable conpot -i ci-smoke
          # The runner has no gVisor, and 'up' refuses a missing runtime before
          # it renders anything: choose Docker's default runtime explicitly.
          sed -i -E 's/^([[:space:]]*sandbox_mode:).*/\1 none/' "$HOME/.qpot/instances/ci-smoke/config.yaml"
          # 'up' regenerates the compose from config (then pulls/starts images).
          # We only need the rendered compose, so cap it with a timeout - image
          # pulls/daemon availability are not what this job validates.
          timeout 90 ./qpot up -i ci-smoke -d >/dev/null 2>&1 || true
          CF="$HOME/.qpot/instances/ci-smoke/docker-compose.yml"
          test -f "$CF"
          # conpot was enabled after 'instance create' wrote the first compose.
          grep -q '^  conpot:$' "$CF" || { echo "::error::'up' did not regenerate the compose"; exit 1; }
          python3 -c "import yaml,sys; yaml.safe_load(open('$CF')); print('compose YAML valid')"
          if grep -qE '^[[:space:]]*- (TPOT_HONEYPOT|HONEYPOT_NAME)=' "$CF"; then
            echo "::error::honeypot container leaks self-identifying env vars"; exit 1
          fi
          echo "CLI smoke run OK"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: qpot-linux-amd64
          path: qpot
          if-no-files-found: error

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Load the pinned tool versions
        # Pinned so a tool-side change cannot silently alter results;
        # scripts/ci-local.sh reads the same file.
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci-tools.env >> "$GITHUB_ENV"
      - name: Run govulncheck (source + binary)
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          GVC="$(go env GOPATH)/bin/govulncheck"
          echo "::group::source scan"
          "$GVC" ./...
          echo "::endgroup::"
          # Also scan the built binary: catches vulnerable code paths reachable
          # in the actual shipped artifact, including the toolchain that built it.
          echo "::group::binary scan"
          go build -o qpot ./cmd/qpot
          "$GVC" -mode=binary ./qpot
          echo "::endgroup::"

  gosec:
    name: Security scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Load the pinned tool versions
        # Pinned so a tool-side change cannot silently alter results;
        # scripts/ci-local.sh reads the same file.
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci-tools.env >> "$GITHUB_ENV"
      - name: Run gosec
        # The excluded rules (GOSEC_EXCLUDES in .github/ci-tools.env, with the
        # reason for each) are systematic false positives for a
        # Docker-orchestrating honeypot. All high-signal rules - SQL injection,
        # weak crypto, TLS misconfig, blocklisted imports, template injection -
        # stay enabled. gosec honours only "// #nosec Gxxx -- reason" to
        # silence a line; //nolint:gosec does nothing.
        run: |
          set -uo pipefail
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          GOSEC="$(go env GOPATH)/bin/gosec"
          # Write SARIF for the Security tab (note: -quiet would suppress the
          # file on a clean run, so it is omitted), print the findings too,
          # and fail on any finding.
          GOSEC_RC=0
          "$GOSEC" -exclude="$GOSEC_EXCLUDES" -fmt sarif -out gosec.sarif -stdout -verbose=text ./... || GOSEC_RC=$?
          echo "gosec exit: ${GOSEC_RC}"
          exit "${GOSEC_RC}"
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so committed-then-removed secrets are caught
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Load the pinned tool versions
        # Pinned so a tool-side change cannot silently alter results;
        # scripts/ci-local.sh reads the same file.
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci-tools.env >> "$GITHUB_ENV"
      - name: Install the pinned scanner and verify its upstream default rules
        run: |
          set -euo pipefail
          go install "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}"
          default_rules="$(go env GOMODCACHE)/github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}/config/gitleaks.toml"
          printf '%s  %s\n' "$GITLEAKS_CONFIG_SHA256" "$default_rules" | sha256sum -c -
      - name: Scan the complete configured history and current tree
        # Exact acknowledged historical exposures remain documented separately.
        # This is an actual full-history scan, not an action-selected push range.
        run: |
          set -euo pipefail
          scanner="$(go env GOPATH)/bin/gitleaks"
          "$scanner" git --redact=100 --no-banner .
          "$scanner" dir --redact=100 --no-banner .
      - name: Reject new source leaks outside decoy allowlists
        run: |
          set -euo pipefail
          scanner="$(go env GOPATH)/bin/gitleaks"
          default_rules="$(go env GOMODCACHE)/github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}/config/gitleaks.toml"
          go run ./internal/cicheck/cirun -root . secrets-source -gitleaks "$scanner" -config "$default_rules"
          QPOT_TEST_SECRET_GATE=1 QPOT_GITLEAKS_BINARY="$scanner" QPOT_GITLEAKS_DEFAULT_CONFIG="$default_rules" \
            go test -race -count=1 -timeout 3m ./internal/cicheck -run '^TestSecretGateLive$'

  fuzz-smoke:
    name: Fuzz smoke (10s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run each fuzz target briefly
        run: |
          # NOTE: errexit (-e, on by default for `shell: bash`) is deliberately
          # OFF here. This script tracks failures explicitly (the `fail` var and
          # `exit "$fail"` at the end) and must inspect each fuzz run's non-zero
          # exit to tell a real crash from Go's short-fuzztime deadline flake.
          # Under -e, `out="$(run_one ...)"; rc=$?` would exit the whole script
          # at the assignment on the first non-zero run, so the retry-on-flake
          # logic below never ran - one flake would fail the job.
          set -uo pipefail
          set +e
          # Discover every Fuzz target with the package it lives in. Collect into
          # an array first (mapfile) so a failing target reliably fails the job -
          # piping straight into `while` would swallow the exit status in a
          # subshell.
          mapfile -t targets < <(
            grep -rl 'func Fuzz' --include='*_test.go' . | while read -r f; do
              pkg="./$(dirname "$f")"
              grep -oE 'func Fuzz[A-Za-z0-9_]+' "$f" | sed 's/^func //' | while read -r fn; do
                echo "$pkg $fn"
              done
            done
          )
          echo "Found ${#targets[@]} fuzz targets"

          run_one() { go test "$1" -run '^$' -fuzz "^${2}\$" -fuzztime 10s 2>&1; }

          # A deadline failure without a crash marker may be a short-fuzztime
          # flake. Retry once, but require a successful run: repeated deadlines
          # are inconclusive and must not turn a failed check green. A crash
          # (panic or "Failing input written") fails without retrying.
          is_flake() {
            grep -q 'context deadline exceeded' <<<"$1" \
              && ! grep -qE 'panic:|Failing input written|runtime error' <<<"$1"
          }

          fail=0
          for line in "${targets[@]}"; do
            pkg="${line%% *}"; fn="${line##* }"
            echo "::group::$pkg $fn"
            out="$(run_one "$pkg" "$fn")"; rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ] && is_flake "$out"; then
              echo "::warning::$fn hit a fuzzing-deadline flake; retrying once"
              out="$(run_one "$pkg" "$fn")"; rc=$?
              echo "$out"
              if [ "$rc" -ne 0 ] && is_flake "$out"; then
                echo "::error::$fn hit the deadline again; fuzzing did not complete successfully"
              fi
            fi
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error::fuzz target $fn FAILED"; fail=1; fi
          done
          exit "$fail"

  connector-test:
    name: ClickHouse-Kibana connector (SQL-safety tests + fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run connector translation tests + fuzz
        # The connector translates attacker-influenced Elasticsearch DSL into
        # ClickHouse SQL; these stdlib-only tests assert no value/identifier can
        # escape its string literal (SQL injection) and include a 20k-iteration
        # fuzz loop. No third-party deps needed - the FastAPI/ClickHouse imports
        # are stubbed inside the test.
        run: python3 docker/clickhouse-kibana/test_main.py

  shellcheck:
    name: Shell lint (install / ops scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Load the pinned tool versions
        # Pinned so a tool-side change cannot silently alter results;
        # scripts/ci-local.sh reads the same file.
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci-tools.env >> "$GITHUB_ENV"
      - name: Install the pinned ShellCheck
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: ShellCheck QPot's install & operational scripts
        # The installer (curl | bash) and the ops scripts are the first thing
        # every user runs - a shell bug here breaks adoption on a whole distro
        # before any Go code executes. Gate them at error level so real defects
        # (bad redirects, unguarded cd, broken quoting, undefined vars) can't
        # land. Vendored upstream T-Pot container scripts under docker/*/dist are
        # intentionally NOT linted here: they are maintained upstream and run
        # inside the honeypot images, not on QPot's install path.
        run: |
          set -euo pipefail
          shellcheck --version
          installed=$(shellcheck --version)
          grep -qx "version: ${SHELLCHECK_VERSION#v}" <<<"$installed"
          shellcheck -S error \
            install.sh deploy.sh update.sh uninstall.sh genuser.sh \
            scripts/install.sh scripts/distro-smoke.sh scripts/test-makefile.sh scripts/test-install.sh \
            scripts/ci-local.sh scripts/test-hifi.sh
          echo "shellcheck (error level) clean"

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Load the pinned tool versions
        # Pinned so a tool-side change cannot silently alter results;
        # scripts/ci-local.sh reads the same file.
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci-tools.env >> "$GITHUB_ENV"
      - name: Install the pinned ShellCheck
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: Run actionlint
        # The CI workflows are code too: a bug in an embedded run: script (bad
        # quoting, an undefined var, a wrong redirect) can make a check silently
        # pass or skip. actionlint validates every workflow's YAML, expressions,
        # and deprecated runners/actions, AND shellchecks the run: scripts
        # (shellcheck is preinstalled on the runner and auto-detected). Installed
        # via go install so it is pinned by module checksum, like the other tools.
        run: |
          set -euo pipefail
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint" -color
          echo "actionlint clean"

  mod-hygiene:
    name: go.mod tidy & verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules and tidiness
        # go mod verify confirms the downloaded dependencies match go.sum (their
        # recorded hashes) - a supply-chain integrity check. go mod tidy must then
        # be a no-op: if it changes go.mod/go.sum, the committed files are out of
        # sync with the imports (stale or missing requirements), which we fail on
        # so the dependency set is always exactly what the code uses.
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi
          echo "modules verified and tidy"

  cross-build:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the CLI and service binaries for the target platform
        # QPot installs across many distros and architectures (the installer
        # supports amd64/arm64/arm). A platform-specific break - a build tag, a
        # syscall, an import that is not portable - would otherwise only surface
        # on a user's machine. CGO is off so these are the same static binaries
        # the release ships. Both the CLI and the HiFi SSH-proxy broker must build.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -o /dev/null ./cmd/qpot
          go build -o /dev/null ./cmd/qpot-sshproxy
          go build -o /dev/null ./cmd/qpot-refrigeration
          go build -o /dev/null ./cmd/qpot-sshbackend
          go build -o /dev/null ./cmd/qpot-netguard
          echo "built CLI and service binaries for ${GOOS}/${GOARCH}"

  distro-runtime:
    name: Run binary on a Linux distro matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the static binary
        # CGO off so this is the same self-contained binary the release ships -
        # the one that must run on musl (Alpine) as well as glibc.
        env:
          CGO_ENABLED: "0"
        run: go build -o qpot ./cmd/qpot
      - name: Smoke-run on every distro
        # cross-build proves QPot *compiles* for each target; this proves it
        # actually *launches and runs* on the major packaging families
        # (Debian/Ubuntu/Fedora/Rocky/openSUSE) and on musl (Alpine), which a
        # cross-compile can never catch. Images come from rate-limit-free mirrors
        # so the job is reproducible. The runner already has a docker daemon.
        run: scripts/distro-smoke.sh ./qpot

  coverage:
    name: Test coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure and report coverage
        # Produce a coverage profile across all packages and surface BOTH the total
        # and a per-package breakdown in the job log and the step summary, so a
        # reviewer can see at a glance which packages the tests actually exercise
        # (the core logic - proxy/intelligence/instance/config - is well covered;
        # the thin cmd/* CLI wrappers and DB code that needs a live database are
        # not, which is why the total floor is deliberately conservative). The
        # floor only guards against a catastrophic collapse (e.g. a whole
        # package's tests being deleted), not normal churn; the profile is
        # uploaded for offline inspection (go tool cover -html=coverage.out).
        run: |
          set -euo pipefail
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out > coverage.txt
          total=$(awk '/^total:/ {print $3+0}' coverage.txt)
          echo "Total coverage: ${total}%"
          # Per-package average (group the per-function lines by their package dir).
          perpkg=$(awk '
            /^total:/ {next}
            { n=split($1,a,"/"); pkg=""; for(i=1;i<n;i++) pkg=pkg a[i]"/";
              sub(/^github.com\/qpot\/qpot\//,"",pkg); cov[pkg]+=$3+0; cnt[pkg]++ }
            END { for (k in cov) printf "%6.1f%%  %s\n", cov[k]/cnt[k], k }
          ' coverage.txt | sort -n)
          {
            echo "## Test coverage";
            echo "**Total: ${total}%**";
            echo "";
            echo '```';
            echo "$perpkg";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$perpkg"
          floor=30
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { printf("::error::total coverage %.1f%% is below the %d%% floor\n", t, f); exit 1 } }'
          echo "coverage ${total}% >= ${floor}% floor"
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: warn

  install-windows:
    name: Windows installer against a local fake release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install.ps1 on PowerShell 7
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: install.ps1 on Windows PowerShell 5.1
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-install.ps1
      - name: Windows-only setup tests
        # Tests that build only on Windows, such as starting Docker Desktop;
        # the Linux jobs never compile them.
        shell: pwsh
        run: go test -count=1 ./internal/hostsetup/
      - name: Windows SSH lifecycle lock
        shell: pwsh
        run: |
          $test = 'TestSSHCellLifecycleLockCancellationAndRelease'
          $pattern = '^' + $test + '$'
          $listed = @(& go test ./internal/instance -list $pattern)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($listed -notcontains $test) { throw "Required Windows lock test is missing: $test" }
          go test -count=1 -timeout 2m ./internal/instance -run $pattern
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows SSH settings and resource limits
        shell: pwsh
        run: |
          $tests = @(
            'TestSSHResourceCapsRejectInvalidOverridesAtomically',
            'TestSSHResourceCapsResolveLegacyDefaultsAndZeroInheritance',
            'TestSSHEnvironmentConfigRoundTrip',
            'TestSSHImageSourceConfigRoundTrip',
            'TestSSHEnvironmentInvalidConfigNeverReplacesSavedFile',
            'TestSaveWaitsForABriefHolder',
            'TestReadWaitsForABriefHolder',
            'TestReadFileLimitAndMissing'
          )
          $pattern = '^(' + ($tests -join '|') + ')$'
          $listed = @(& go test ./internal/config -list $pattern)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in $tests) {
            if ($listed -notcontains $test) { throw "Required Windows settings test is missing: $test" }
          }
          go test -count=1 -timeout 3m ./internal/config -run $pattern
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows SSH storage metadata and migration
        shell: pwsh
        run: |
          $tests = @(
            'TestSSHStorePlanningIsPureAndReservationIsPinned',
            'TestSSHStoreMigrationPreservesKeysRecordsContextsAndInodes',
            'TestSSHStoreInterruptedMigrationResumesAndConflictFailsClosed',
            'TestSSHStoreRejectsSymlinksMalformedAndForeignOwnership',
            'TestSSHStoreEmptyIDReservationRerendersAndRemovalChecksOwnership',
            'TestSSHStoreMissingPriorLayoutCannotMoveExistingBindSources',
            'TestSSHStoreCollectorMountsExposeOnlyReadOnlyRecordsAndNeverSeedNativeEvidence',
            'TestSSHRuntimeMarkerStateOrderAndPrivateNamespace',
            'TestSSHRuntimeImageCompatibility',
            'TestSSHLayoutImageCompatibility',
            'TestSSHPublishedBuildRevision',
            'TestSSHBrokerHostReadableOnlyForVerifiedReadyPrivateStore',
            'TestRecyclerMetadataReadFailureReportsOnceAndRecoversWithoutLostAuthority',
            'TestReadNewLinesDetailedPreservesCursorOnErrors',
            'TestBrokerMetadataRotationUsesOpenedIdentityAndRetainsItOnError'
          )
          $pattern = '^(' + ($tests -join '|') + ')$'
          $listed = @(& go test ./internal/instance -list $pattern)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in $tests) {
            if ($listed -notcontains $test) { throw "Required Windows migration test is missing: $test" }
          }
          go test -count=1 -timeout 3m ./internal/instance -run $pattern
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows collector checkpoint migration
        shell: pwsh
        run: |
          $tests = @(
            'TestMigrateLegacyPreservesCursorsAndInodes',
            'TestMigrateLegacyNoStateDoesNotCreateDirectories',
            'TestMigrateLegacyRefusesConflictingStates',
            'TestMigrateLegacyRefusesFilesAndSymlinks',
            'TestMigrateLegacyRefusesNonordinaryContents',
            'TestMigrateLegacyBoundsDirectoryTraversal',
            'TestMigrateLegacyRenameFailureRetainsOriginal',
            'TestMigrateLegacySyncFailureDoesNotClaimRollback'
          )
          $pattern = '^(' + ($tests -join '|') + ')$'
          $listed = @(& go test ./internal/vectorstate -list $pattern)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in $tests) {
            if ($listed -notcontains $test) { throw "Required Windows migration test is missing: $test" }
          }
          go test -count=1 -timeout 3m ./internal/vectorstate -run $pattern
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows broker log compatibility
        shell: pwsh
        run: |
          $tests = @(
            'TestHostReadableSessionLogBooleanIsStrictBeforeEffects',
            'TestSessionLogDefaultPreservesExistingModeBytesAndInode',
            'TestSessionLogDefaultKeepsTrustedSymlinkPath',
            'TestHostReadableSessionLogUnsupportedPlatformHasNoEffects'
          )
          $pattern = '^(' + ($tests -join '|') + ')$'
          $listed = @(& go test ./cmd/qpot-sshproxy -list $pattern)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in $tests) {
            if ($listed -notcontains $test) { throw "Required Windows broker log test is missing: $test" }
          }
          go test -count=1 -timeout 3m ./cmd/qpot-sshproxy -run $pattern
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows archive selection and handle release
        shell: pwsh
        run: |
          $tests = @(
            'TestSSHArchiveSelectionReusesBudgetAndClosesCellHandles',
            'TestSSHArchiveSelectionCancellationClosesCellHandles'
          )
          $pattern = '^(' + ($tests -join '|') + ')$'
          $listed = @(& go test ./internal/cleanup -list $pattern)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in $tests) {
            if ($listed -notcontains $test) { throw "Required Windows archive selection test is missing: $test" }
          }
          go test -count=1 -timeout 3m ./internal/cleanup -run $pattern
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
