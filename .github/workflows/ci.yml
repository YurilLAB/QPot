name: CI

# Build, vet, format-check, race-test, vuln-scan and a short fuzz smoke run on
# every push/PR. This is the gate that would have caught the broken build that
# previously reached main (server.go referencing a method the worker lacked).

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet, fmt & race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -timeout 10m ./...

  build-run:
    name: Build binary & CLI smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build qpot binary
        run: go build -o qpot ./cmd/qpot
      - name: Smoke-run the CLI
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          ./qpot --version
          ./qpot --help >/dev/null
          ./qpot honeypot list
          ./qpot instance create ci-smoke
          ./qpot instance list | grep -q ci-smoke
          # The generated docker-compose.yml must render and be valid YAML, and
          # must not leak self-identifying env vars into honeypot containers.
          ./qpot honeypot enable cowrie -i ci-smoke
          ./qpot honeypot enable conpot -i ci-smoke
          # 'up' regenerates the compose from config (then pulls/starts images).
          # We only need the rendered compose, so cap it with a timeout - image
          # pulls/daemon availability are not what this job validates.
          timeout 90 ./qpot up -i ci-smoke -d >/dev/null 2>&1 || true
          CF="$HOME/.qpot/instances/ci-smoke/docker-compose.yml"
          test -f "$CF"
          python3 -c "import yaml,sys; yaml.safe_load(open('$CF')); print('compose YAML valid')"
          if grep -qE '^[[:space:]]*- (TPOT_HONEYPOT|HONEYPOT_NAME)=' "$CF"; then
            echo "::error::honeypot container leaks self-identifying env vars"; exit 1
          fi
          echo "CLI smoke run OK"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: qpot-linux-amd64
          path: qpot
          if-no-files-found: error

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  fuzz-smoke:
    name: Fuzz smoke (10s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run each fuzz target briefly
        run: |
          set -euo pipefail
          # Discover every Fuzz target with the package it lives in. Collect into
          # an array first (mapfile) so a failing target reliably fails the job -
          # piping straight into `while` would swallow the exit status in a
          # subshell.
          mapfile -t targets < <(
            grep -rl 'func Fuzz' --include='*_test.go' . | while read -r f; do
              pkg="./$(dirname "$f")"
              grep -oE 'func Fuzz[A-Za-z0-9_]+' "$f" | sed 's/^func //' | while read -r fn; do
                echo "$pkg $fn"
              done
            done
          )
          echo "Found ${#targets[@]} fuzz targets"
          for line in "${targets[@]}"; do
            pkg="${line%% *}"
            fn="${line##* }"
            echo "::group::$pkg $fn"
            go test "$pkg" -run '^$' -fuzz "^${fn}\$" -fuzztime 10s
            echo "::endgroup::"
          done
