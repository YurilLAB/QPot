name: CI

# Build, vet, format-check, race-test, vuln-scan and a short fuzz smoke run on
# every push/PR. This is the gate that would have caught the broken build that
# previously reached main (server.go referencing a method the worker lacked).

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet, fmt & race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -timeout 10m ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  fuzz-smoke:
    name: Fuzz smoke (10s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run each fuzz target briefly
        run: |
          set -euo pipefail
          # Discover every Fuzz target with the package it lives in. Collect into
          # an array first (mapfile) so a failing target reliably fails the job -
          # piping straight into `while` would swallow the exit status in a
          # subshell.
          mapfile -t targets < <(
            grep -rl 'func Fuzz' --include='*_test.go' . | while read -r f; do
              pkg="./$(dirname "$f")"
              grep -oE 'func Fuzz[A-Za-z0-9_]+' "$f" | sed 's/^func //' | while read -r fn; do
                echo "$pkg $fn"
              done
            done
          )
          echo "Found ${#targets[@]} fuzz targets"
          for line in "${targets[@]}"; do
            pkg="${line%% *}"
            fn="${line##* }"
            echo "::group::$pkg $fn"
            go test "$pkg" -run '^$' -fuzz "^${fn}\$" -fuzztime 10s
            echo "::endgroup::"
          done
